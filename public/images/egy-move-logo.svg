<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440">
  <defs>
    <style>
      .gold { fill: #E8A317; }
      .navy { fill: #0B1F3A; }
      .text-ar {
        font-family: 'Rubik', 'Segoe UI', 'Tahoma', Arial, sans-serif;
        font-weight: 600;
        font-size: 82px;
        fill: #E8A317;
        direction: rtl;
        letter-spacing: -1px;
      }
    </style>
  </defs>

  <!-- ===== ICON GROUP ===== -->
  <g transform="translate(20, 10)">
    <!-- House roof + body -->
    <path class="gold" d="M260 28 L355 108 L355 178 L165 178 L165 108 Z"/>
    <!-- House body clean -->
    <rect class="gold" x="180" y="108" width="160" height="70" rx="3"/>
    
    <!-- Windows (3 small squares) -->
    <rect class="navy" x="205" y="125" width="20" height="20" rx="2"/>
    <rect class="navy" x="240" y="125" width="20" height="20" rx="2"/>
    <rect class="navy" x="275" y="125" width="20" height="20" rx="2"/>

    <!-- Decorative waves (left of truck) -->
    <path d="M70 195 C120 145, 175 165, 220 195 C245 210, 265 185, 295 175" 
          stroke="#E8A317" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M55 215 C110 165, 165 185, 215 215 C245 230, 270 205, 300 195" 
          stroke="#0B1F3A" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M85 235 C130 195, 180 210, 230 230 C255 240, 280 220, 310 215" 
          stroke="#E8A317" stroke-width="9" stroke-linecap="round" fill="none"/>

    <!-- Truck cargo box -->
    <rect class="navy" x="250" y="188" width="105" height="58" rx="5"/>
    
    <!-- Truck cab -->
    <path class="gold" d="M355 205 L405 205 L422 235 L422 246 L355 246 Z"/>
    
    <!-- Cab window -->
    <path class="navy" d="M365 213 L398 213 L408 232 L365 232 Z"/>
    
    <!-- Wheels -->
    <circle class="gold" cx="280" cy="252" r="16"/>
    <circle class="navy" cx="280" cy="252" r="8"/>
    <circle class="gold" cx="385" cy="252" r="16"/>
    <circle class="navy" cx="385" cy="252" r="8"/>
  </g>

  <!-- ===== ARABIC TEXT ===== -->
  <text class="text-ar" x="280" y="355" text-anchor="middle">ايجي موف</text>

  <!-- ===== DECORATIVE LINE + ORNAMENT ===== -->
  <g transform="translate(0, 15)">
    <line x1="145" y1="385" x2="235" y2="385" stroke="#E8A317" stroke-width="2.5"/>
    <line x1="325" y1="385" x2="415" y2="385" stroke="#E8A317" stroke-width="2.5"/>
    
    <!-- Center ornament -->
    <path class="gold" d="M270 375 Q280 360 290 375 Q280 390 270 375 Z"/>
    <circle class="gold" cx="280" cy="378" r="3.5"/>
    <path d="M265 385 Q280 395 295 385" stroke="#E8A317" stroke-width="1.8" fill="none"/>
  </g>
</svg>
